# Available Models:
model_a: "google/gemma-3-4b-it"
model_b: "google/gemma-3-4b-it"

# Directories
model_cache_dir: "./models"
vector_dir: "./vectors"
knowledge_base_dir: "./knowledge_bases" # New: Directory for knowledge base files

# Default Settings
default_temperature: 0.3
default_top_k: 50
max_tokens: 256
default_intensity_a: 0 # -225.0 # 150.0
default_intensity_b: 0 # 22.0
max_context_messages: 10 # Fixed typo from max_context_messagess
default_num_beams: 1 # Updated default for num_beams
default_length_penalty: 5.0 # Updated default for length_penalty
decay_rate: 1.0 # Changed key from default_decay_rate
default_warmup_tokens: 0 # New: Number of tokens used to linearly warm up steering intensity
default_min_intensity_a: -225.0 # 150.0 # New: Minimum intensity floor after warmup/decay
default_min_intensity_b: 22.0
steering_vector_layer_a: "mlp" # New: Configurable layer for steering vector application
steering_vector_layer_b: "mlp" # New: Configurable layer for steering vector application

# Preloaded Steering Vectors (PyTorch .pt files)
vector_a: null # ./vectors/descalate.pt
vector_b: null # ./vectors/angryplusreassurance.pt

# Default Roles (one for each model, displayed in UI text boxes)
default_role_a: |
  Role - Act exclusively as a physician in a live clinical encounter.
  Objective - Answer the patient’s questions using only the provided 'Knowledge Base.'
  Communication Style Guidelines -
    Answer Length - Around 3 sentences; Each response should be as long as a real-time verbal response would be like. Each response should be as long as a real-time verbal response would be like.
    Natural Cadence - Use a conversational tone. Avoid bullet points or long lists unless specifically asked.
    No Scripting - Do not generate any dialogue for the patient. Wait for the user's input.
    Strict Grounding - If a patient asks something not covered in the Knowledge Base, pivot back to the available information or politely state that you'd need to look into that further.

default_role_b: |
  Role - Act as a patient with no medical background and a high school education.
  Objective - Engage in a conversation with a physician about your health concerns. You must link every sentence you speak to the physician's latest explanation regarding the topic in the conversation history. Do not introduce completely new medical complaints, symptoms, or side-effects unless they are a direct consequence of the topic being discussed.
  Communication Style Guidelines -
    Simple Language - Use 'living room' English. Use words like 'soreness,' 'funny feeling,' or 'trouble catching my breath' instead of clinical terms.
    Answer Length - Around 3 sentences; Each response should be as long as a real-time verbal response would be like. Each response should be as long as a real-time verbal response would be like.
    Focus on Feeling - Describe how you feel in your own words.
    Natural Cadence - Use a conversational tone.
    No Scripting - Only speak for the patient. Do not generate the doctor's responses.
    Stay Focused - Stick to the specific health issue being discussed. Do not offer a diagnosis; only share symptoms and concerns.


# Role names
default_name_a: "Physician"
default_name_b: "Patient"

# Default Knowledge Bases (text files, relative to knowledge_base_dir)
# These are now folders that will contain individual KB files for dynamic loading
default_knowledge_base_a_folder: "knowledge_bases" # e.g., "knowledge_bases/physician_kb"
default_knowledge_base_b_folder: "knowledge_bases" # e.g., "knowledge_bases/patient_kb"

# UI Preferences
ui_theme: "light"

# CLI Settings
# cli_input_folder: "./cli_inputs" # Removed: Input is now from a CSV
cli_input_data: "./inputs/tuning.csv" # New: Path to the CSV input file
cli_max_turns: 3 # Number of turns for the CLI conversation
cli_output_folder: "./outputs/test2" # Folder to save individual conversation history files
cli_starting_model: "model_a" # Which model starts the CLI conversation
"batch_size": 3 # New: Batch size for processing conversations in the CLI
